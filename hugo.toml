baseURL = "https://fbmguerin.github.io/"
title = "François Guerin"
locale = "fr"
defaultContentLanguage = "fr"
timeZone = "Europe/Paris"
enableGitInfo = true            # .Lastmod = date du dernier commit qui touche index.md
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "robotstxt"]

[permalinks.page]
  articles = "/articles/:contentbasename/"   # nom du dossier, pas le titre (voir README)

[params]
  # Adresse courriel en deux morceaux : jamais écrite en entier, ni dans le dépôt ni
  # dans les pages. Les pages n'en portent qu'une forme encodée, que courriel.js
  # ne décode qu'au clic (voir README, « Adresse courriel »).
  courriel_nom = "francoisguerin+fromfbmgsite"
  courriel_domaine = "ikmail.com"
  github = "fbmguerin"                                   # lien GitHub de la barre
  # Avatar de la barre, chargé directement chez GitHub (par identifiant de compte :
  # survit à un renommage ; s=64 pour un affichage net en 32 px). Toujours l'avatar actuel.
  avatar = "https://avatars.githubusercontent.com/u/336461502?s=64"
  favoris = "https://github.com/fbmguerin?tab=stars"     # bouton étoile (plus tard : un article)

# Couleur imposée à un tag (0 à 7, voir --t0… dans site.css). Sans entrée, chaque
# nouveau tag prend la couleur suivante, dans l'ordre d'apparition des articles.
[params.couleurs]
  # linux = 0

# Coloration du code par classes Chroma (palette dans assets/css/site.css).
[markup.highlight]
  noClasses = false

# Images seules dans un paragraphe : rendues en <figure> (voir le hook d'image).
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Flux Atom maison : le RSS natif de Hugo n'a pas de date de mise à jour par article.
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]
[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  rel = "alternate"
[outputs]
  home = ["html", "atom"]
  page = ["html"]
