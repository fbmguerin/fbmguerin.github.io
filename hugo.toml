baseURL = "https://fbmguerin.github.io/"
title = "François Guerin"
locale = "fr"
defaultContentLanguage = "fr"
timeZone = "Europe/Paris"
enableGitInfo = true            # .Lastmod = date du dernier commit qui touche index.md
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "robotstxt"]

[permalinks.page]
  articles = "/articles/:contentbasename/"   # nom du dossier, pas le titre (voir README)

[params]
  email = "francoisguerin@ikmail.com"
  depot = "https://github.com/fbmguerin/fbmguerin.github.io"

# Coloration du code par classes Chroma (palette dans assets/css/site.css).
[markup.highlight]
  noClasses = false

# Images seules dans un paragraphe : rendues en <figure> (voir le hook d'image).
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Flux Atom maison : le RSS natif de Hugo n'a pas de date de mise à jour par article.
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]
[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  rel = "alternate"
[outputs]
  home = ["html", "atom"]
  page = ["html"]
