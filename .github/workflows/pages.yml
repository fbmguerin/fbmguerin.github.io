# Construit le site avec Hugo et le déploie sur GitHub Pages.
#
# - Ne déploie que la branche main.
# - Reconstruction quotidienne : nécessaire pour que les épingles expirent
#   (epingle_jusqu_au est comparé à la date de construction).
# - Sveltia CMS (/admin/) est un simple fichier statique : rien à construire.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # tous les jours vers 04:17 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"

jobs:
  build:
    # Garde-fou : workflow_dispatch peut viser n'importe quelle branche.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet : dates de révision tirées de git

      - id: pages
        uses: actions/configure-pages@v6

      # Calendrier des contributions GitHub, en pied de page (README, « Calendrier GitHub »).
      # Seulement si le secret METRICS_TOKEN existe ; un échec ne bloque pas le site,
      # qui sort alors sans calendrier. Action figée sur un commit (v3.34) : elle reçoit le jeton.
      - name: Calendrier GitHub
        # Cet id doit commencer par « lowlighter » : metrics le lit (github.action) pour savoir
        # s'il est la version officielle et télécharger son image Docker toute prête ;
        # sinon il se croit un fork et la recompile, ce qui échoue.
        id: lowlighter_metrics
        if: env.METRICS_TOKEN != ''
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: calendrier.json
          config_output: json
          output_action: none
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 2 # année en cours et précédente : 12 mois glissants
          config_timezone: Europe/Paris

      - name: Ranger le calendrier
        if: steps.lowlighter_metrics.outcome == 'success'
        run: |
          mkdir -p assets/github
          sudo cat /metrics_renders/calendrier.json > assets/github/calendrier.json

      - name: Signaler l'absence du calendrier
        if: steps.lowlighter_metrics.outcome == 'failure'
        run: echo "::warning title=Calendrier GitHub::Non rendu (voir l'étape « Calendrier GitHub ») ; le site sort sans calendrier."

      - name: Installer Hugo
        run: |
          curl -sSLo "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Construire
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
