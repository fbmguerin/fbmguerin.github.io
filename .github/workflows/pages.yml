# Construit le site avec Hugo et le déploie sur GitHub Pages.
#
# - Ne déploie que la branche main.
# - Reconstruction quotidienne : nécessaire pour que les épingles expirent
#   (epingle_jusqu_au est comparé à la date de construction).
# - Sveltia CMS (/admin/) est un simple fichier statique : rien à construire.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # tous les jours vers 04:17 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"

jobs:
  build:
    # Garde-fou : workflow_dispatch peut viser n'importe quelle branche.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet : dates de révision tirées de git

      - id: pages
        uses: actions/configure-pages@v6

      - name: Installer Hugo
        run: |
          curl -sSLo "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Construire
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
