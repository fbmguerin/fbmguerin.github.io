<!doctype html>
<html lang="{{ .Params.lang | default site.Language.Lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
{{ with site.Home.OutputFormats.Get "atom" }}<link rel="alternate" type="application/atom+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
{{ block "main" . }}{{ end }}
</body>
</html>
