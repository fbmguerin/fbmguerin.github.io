{{ define "main" }}
<article>
<h1>{{ .Title }}</h1>
<p>Publié le <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
{{- if gt (.Lastmod.Format "2006-01-02") (.Date.Format "2006-01-02") }} · révisé le <time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Lastmod.Format "2006-01-02" }}</time>{{ end }}</p>
<p>{{ range .Params.tags }}<span class="tag">{{ . }}</span> {{ end }}</p>
{{ .Content }}
</article>
{{ end }}
